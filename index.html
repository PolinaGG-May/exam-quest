<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Quest — Мотивация</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 { font-size: 24px; text-align: center; color: #2c3e50; }
        .score-box {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            background: #eef2f3;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #27ae60;
        }
        h2 { font-size: 18px; margin-bottom: 10px; }
        ul { list-style: none; padding: 0; }
        li {
            background: #fafafa;
            border: 1px solid #ddd;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }
        li:hover { background: #f0f0f0; }
        li.selected { border-color: #27ae60; background: #e8f8f5; }
        button {
            width: 100%;
            padding: 12px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        button:hover { background: #219653; }
        .admin-section {
            margin-top: 30px;
            border-top: 2px dashed #ddd;
            padding-top: 15px;
        }
        .admin-btn { background: #2c3e50; font-size: 14px; padding: 8px; margin-top: 5px; }
        .admin-btn:hover { background: #34495e; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎮 Exam Quest</h1>
    <div class="score-box" id="scoreDisplay">Баланс: 0 XP</div>

    <h2>🎁 Магазин наград:</h2>
    <ul id="rewardsList"></ul>

    <button onclick="buyReward()">Купить выбранный купон</button>

    <div class="admin-section">
        <button class="admin-btn" onclick="toggleAdmin()">⚙️ Режим админа</button>
        <div id="adminPanel" class="hidden" style="margin-top: 10px;">
            <button class="admin-btn" style="background: #2980b9;" onclick="addXP(100)">+100 XP (Вебинар)</button>
            <button class="admin-btn" style="background: #2980b9;" onclick="addXP(150)">+150 XP (ДЗ)</button>
            <button class="admin-btn" style="background: #c0392b;" onclick="addXP(-300)">-300 XP (Штраф)</button>
        </div>
    </div>
</div>

<script>
    // Список наград (можешь менять их прямо здесь, когда захочешь!)
    let rewards = [
        { title: "Массаж 15 минут", cost: 300 },
        { title: "Выбор фильма на вечер", cost: 400 },
        { title: "Пицца / Вкусняшка", cost: 800 }
    ];

    let score = localStorage.getItem('exam_score') ? parseInt(localStorage.getItem('exam_score')) : 0;
    let selectedIndex = null;

    function updateUI() {
        document.getElementById('scoreDisplay').innerText = `Баланс: ${score} XP`;
        localStorage.setItem('exam_score', score);

        let listHTML = '';
        rewards.forEach((r, index) => {
            let selectedClass = selectedIndex === index ? 'selected' : '';
            listHTML += `<li class="${selectedClass}" onclick="selectReward(${index})">
                <span>${r.title}</span>
                <b>${r.cost} XP</b>
            </li>`;
        });
        document.getElementById('rewardsList').innerHTML = listHTML;
    }

    function selectReward(index) {
        selectedIndex = index;
        updateUI();
    }

    function buyReward() {
        if (selectedIndex === null) {
            alert("Сначала выбери купон из списка!");
            return;
        }
        let reward = rewards[selectedIndex];
        if (score >= reward.cost) {
            score -= reward.cost;
            alert(`Поздравляю! Ты купил: «${reward.title}». Покажи этот экран ей! ❤️`);
            selectedIndex = null;
            updateUI();
        } else {
            alert("Не хватает баллов! Нужно еще подналечь на учебу 📚");
        }
    }

    function toggleAdmin() {
        let pass = prompt("Введи пароль админа:");
        if (pass === "2007132007") { // Пароль можно изменить тут
            let panel = document.getElementById('adminPanel');
            panel.classList.toggle('hidden');
        } else if (pass !== null) {
            alert("Неверный пароль!");
        }
    }

    function addXP(amount) {
        score += amount;
        if (score < 0) score = 0;
        alert(amount > 0 ? `Зачислено +${amount} XP!` : `Списано ${amount} XP!`);
        updateUI();
    }

    updateUI();
</script>

</body>
</html>
