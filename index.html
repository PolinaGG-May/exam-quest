<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Quest — Мотивация</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 { font-size: 24px; text-align: center; color: #2c3e50; margin-bottom: 5px; }
        .score-box {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            background: #eef2f3;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #27ae60;
        }
        h2 { font-size: 18px; margin-bottom: 10px; }
        ul { list-style: none; padding: 0; }
        li {
            background: #fafafa;
            border: 1px solid #ddd;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }
        li:hover { background: #f0f0f0; }
        li.selected { border-color: #27ae60; background: #e8f8f5; }
        button {
            width: 100%;
            padding: 12px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        button:hover { background: #219653; }
        .admin-section {
            margin-top: 30px;
            border-top: 2px dashed #ddd;
            padding-top: 15px;
        }
        .admin-btn { background: #2c3e50; font-size: 14px; padding: 10px; margin-top: 5px; }
        .admin-btn:hover { background: #34495e; }
        .logout-btn { background: #7f8c8d; }
        .logout-btn:hover { background: #95a5a6; }
        .refresh-btn { background: #16a085; font-size: 14px; margin-top: 15px; }
        .refresh-btn:hover { background: #1abc9c; }
        .hidden { display: none; }
        
        .add-reward-box {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 10px;
            border-radius: 6px;
            margin-top: 15px;
        }
        .add-reward-box input {
            width: calc(100% - 20px);
            padding: 8px;
            margin-bottom: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .status-text {
            font-size: 12px;
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>❤️ Exam Quest ❤️</h1>
    <div class="status-text" id="statusText">Данные актуальны</div>

    <div class="score-box" id="scoreDisplay">Баланс: ... XP</div>

    <h2>🎁 Магазин наград:</h2>
    <ul id="rewardsList"></ul>

    <button onclick="buyReward()">Купить выбранный купон</button>

    <!-- Кнопка обновления баланса перенесена сюда -->
    <button class="refresh-btn" onclick="loadCloudData()">🔄 Обновить баланс вручную</button>

    <div class="admin-section">
        <button id="toggleAdminBtn" class="admin-btn" onclick="toggleAdmin()">⚙️ Режим админа</button>
        
        <div id="adminPanel" class="hidden" style="margin-top: 10px;">
            <button class="admin-btn" style="background: #2980b9;" onclick="addXP(100)">+100 XP (Вебинар)</button>
            <button class="admin-btn" style="background: #2980b9;" onclick="addXP(150)">+150 XP (ДЗ)</button>
            <button class="admin-btn" style="background: #c0392b;" onclick="addXP(-300)">-300 XP (Штраф)</button>
            <button class="admin-btn" style="background: #8e44ad;" onclick="addCustomXP()">✏️ Свое количество XP</button>

            <!-- Форма добавления нового купона -->
            <div class="add-reward-box">
                <h3 style="margin-top:0; font-size:14px;">➕ Добавить новый купон:</h3>
                <input type="text" id="newTitle" placeholder="Название купона">
                <input type="number" id="newCost" placeholder="Стоимость в XP">
                <button class="admin-btn" style="background: #27ae60; margin-top:0;" onclick="addNewReward()">Сохранить купон</button>
            </div>

            <button class="admin-btn logout-btn" onclick="logoutAdmin()">🔒 Выйти из режима админа</button>
        </div>
    </div>
</div>

<script>
    // 🔑 ВСТАВЬ СВОЙ МАСТЕР-КЛЮЧ В КАВЫЧКИ ВМЕСТО ТЕКСТА НИЖЕ:
    const BIN_ID = "6ad25a65ac6210605a37eb9d";
    const API_KEY = "$2a$10$efoWln3zx2rm2bK7xiqIAu8Q1moziuHQiX05mu77LIU1KdHm3.8iu";

    const defaultRewards = [
        { title: "Массаж 15 минут", cost: 300 },
        { title: "Выбор фильма на вечер", cost: 400 },
        { title: "Пицца / Вкусняшка", cost: 800 }
    ];

    let gameState = {
        score: 0,
        rewards: defaultRewards
    };

    let selectedIndex = null;
    let isAdmin = false;

    async function loadCloudData() {
        document.getElementById('statusText').innerText = "🔄 Обновление данных...";
        try {
            let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { "X-Master-Key": API_KEY }
            });
            let json = await res.json();
            if (json.record && json.record.score !== undefined) {
                gameState = json.record;
            }
            document.getElementById('statusText').innerText = "☁️ Данные актуальны";
        } catch (e) {
            console.error(e);
            document.getElementById('statusText').innerText = "⚠️ Ошибка загрузки";
        }
        renderUI();
    }

    async function saveCloudData() {
        document.getElementById('statusText').innerText = "💾 Сохранение...";
        try {
            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "X-Master-Key": API_KEY
                },
                body: JSON.stringify(gameState)
            });
            document.getElementById('statusText').innerText = "☁️ Сохранено в облако";
        } catch (e) {
            console.error(e);
            document.getElementById('statusText').innerText = "⚠️ Ошибка сохранения";
        }
        renderUI();
    }

    function renderUI() {
        document.getElementById('scoreDisplay').innerText = `Баланс: ${gameState.score} XP`;

        let listHTML = '';
        gameState.rewards.forEach((r, index) => {
            let selectedClass = selectedIndex === index ? 'selected' : '';
            let deleteBtn = isAdmin ? `<span onclick="deleteReward(event, ${index})" style="color:red; margin-left:10px; font-weight:bold; cursor:pointer;" title="Удалить">❌</span>` : '';
            listHTML += `<li class="${selectedClass}" onclick="selectReward(${index})">
                <span>${r.title} ${deleteBtn}</span>
                <b>${r.cost} XP</b>
            </li>`;
        });
        document.getElementById('rewardsList').innerHTML = listHTML;
    }

    function selectReward(index) {
        selectedIndex = index;
        renderUI();
    }

    async function buyReward() {
        if (selectedIndex === null) {
            alert("Сначала выбери купон из списка!");
            return;
        }
        let reward = gameState.rewards[selectedIndex];
        if (gameState.score >= reward.cost) {
            gameState.score -= reward.cost;
            alert(`Поздравляю! Ты купил: «${reward.title}». Покажи этот экран ей! ❤️`);
            selectedIndex = null;
            await saveCloudData();
        } else {
            alert("Не хватает баллов! Нужно еще поучиться 📚");
        }
    }

    function toggleAdmin() {
        if (isAdmin) return;
        let pass = prompt("Введи пароль админа:");
        if (pass === "2007132007") {
            isAdmin = true;
            document.getElementById('adminPanel').classList.remove('hidden');
            document.getElementById('toggleAdminBtn').classList.add('hidden');
            renderUI();
        } else if (pass !== null) {
            alert("Неверный пароль!");
        }
    }

    function logoutAdmin() {
        isAdmin = false;
        document.getElementById('adminPanel').classList.add('hidden');
        document.getElementById('toggleAdminBtn').classList.remove('hidden');
        renderUI();
    }

    async function addXP(amount) {
        gameState.score += amount;
        if (gameState.score < 0) gameState.score = 0;
        alert(amount >= 0 ? `Зачислено +${amount} XP!` : `Списано ${Math.abs(amount)} XP!`);
        await saveCloudData();
    }

    async function addCustomXP() {
        let input = prompt("Введи число баллов:");
        if (input !== null) {
            let val = parseInt(input);
            if (!isNaN(val)) {
                await addXP(val);
            } else {
                alert("Пожалуйста, введи корректное число.");
            }
        }
    }

    async function addNewReward() {
        let titleInput = document.getElementById('newTitle').value.trim();
        let costInput = parseInt(document.getElementById('newCost').value);

        if (!titleInput || isNaN(costInput) || costInput <= 0) {
            alert("Введи название и стоимость купона!");
            return;
        }

        gameState.rewards.push({ title: titleInput, cost: costInput });
        document.getElementById('newTitle').value = '';
        document.getElementById('newCost').value = '';
        alert(`Купон «${titleInput}» добавлен!`);
        await saveCloudData();
    }

    async function deleteReward(event, index) {
        event.stopPropagation();
        if (confirm(`Удалить купон «${gameState.rewards[index].title}»?`)) {
            gameState.rewards.splice(index, 1);
            if (selectedIndex === index) selectedIndex = null;
            await saveCloudData();
        }
    }

    // Загрузка при открытии
    loadCloudData();
</script>

</body>
</html>
